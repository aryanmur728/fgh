<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: #fff;
            width: 100%;
            padding: 15px 20px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header nav a {
            margin-left: 15px;
            color: #fff;
            text-decoration: none;
        }

        .login-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        .login-container h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #555;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        .info-message {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
            line-height: 1.5;
            text-align: center;
        }

        .info-message strong {
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">My Photography</div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="login-container">
        <h1>Enter Password</h1>
        <input type="password" id="password" placeholder="Enter password">
        <button onclick="verifyPassword()">Submit</button>
        <div class="error-message" id="error"></div>
        <div class="info-message">
            <strong>Note:</strong> The account can only be access by the owner for site editing purposes.<br>
            You can enjoy viewing the pictures on the <a href="index.html" style="color: #333; text-decoration: underline;">Home</a> page.<br>
            <strong>Thank you!</strong>
        </div>
    </div>

    <script>
        function verifyPassword() {
            const passwordInput = document.getElementById("password").value;
            const error = document.getElementById("error");

            if (passwordInput === "photos") {
                // Redirect to the account page
                window.location.href = "account.html";
            } else {
                // Show error message
                error.textContent = "Incorrect password. Please try again.";
            }
        }
    </script>
</body>
</html>
